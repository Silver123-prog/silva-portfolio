<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silva | Web Developer</title>
  <meta name="description" content="Silva builds fast, mobile-friendly business websites, WordPress stores and React apps for clients worldwide." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f6f4; --surface: #ffffff; --ink: #0e1f1c; --muted: #4f625e; --line: #d5e0db;
      --primary: #1b5e4b; --on-primary: #ffffff; --soft: #dceee6; --amber: #e0a526;
      --deep: #0e2a25; --on-deep: #eaf4f0; --on-deep-muted: #a6c2ba;
      --display: "Bricolage Grotesque", system-ui, sans-serif;
      --body: "Figtree", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1714; --surface: #11241f; --ink: #e8f2ee; --muted: #9db5ae; --line: #21403a;
        --primary: #5fd0a4; --on-primary: #06201a; --soft: #17332d; --deep: #0e2a25;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.65 var(--body); }
    h1, h2, h3 { font-family: var(--display); line-height: 1.08; letter-spacing: -0.02em; margin: 0; }
    h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); }
    p { margin: 0; }
    a { color: var(--primary); text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }
    .wrap { width: min(1080px, 100% - 2rem); margin-inline: auto; }
    section { padding-block: clamp(3rem, 8vw, 5.5rem); }
    .skip { position: absolute; left: 1rem; top: -4rem; background: var(--primary); color: var(--on-primary); padding: .5rem 1rem; border-radius: 8px; z-index: 20; }
    .skip:focus { top: 1rem; }

    /* header */
    header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .bar { display: flex; align-items: center; gap: 1.25rem; padding-block: .8rem; }
    .logo { display: flex; align-items: center; gap: .6rem; font-family: var(--display); font-weight: 700; font-size: 1.3rem; color: var(--ink); text-decoration: none; margin-right: auto; }
    .logo-mark { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--amber); color: #2b1d00; display: grid; place-items: center; font-size: 1.15rem; overflow: hidden; flex: none; }
    .logo-mark img { width: 100%; height: 100%; object-fit: cover; }
    nav { display: flex; gap: 1.25rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--ink); }
    .btn { display: inline-block; background: transparent; cursor: pointer; font: inherit; font-weight: 700; text-decoration: none; padding: .7rem 1.2rem; border-radius: 10px; border: 1.5px solid transparent; transition: transform .12s, filter .15s; }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-line { border-color: var(--ink); color: var(--ink); }
    .btn-line:hover { background: var(--soft); }
    @media (max-width: 640px) { nav { display: none; } }

    /* hero */
    .hero { display: grid; gap: 2.5rem; align-items: center; }
    @media (min-width: 860px) { .hero { grid-template-columns: 1.35fr 1fr; gap: 4rem; } }
    .status { display: inline-flex; align-items: center; gap: .5rem; background: var(--soft); padding: .3rem .9rem; border-radius: 999px; font-weight: 500; font-size: .92rem; margin-bottom: 1.25rem; }
    .status i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--amber); }
    h1 { font-size: clamp(2.5rem, 7vw, 4.6rem); font-weight: 700; }
    .hero p.lead { color: var(--muted); font-size: 1.15rem; max-width: 46ch; margin-block: 1.4rem 2rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; }
    .card-deep { background: var(--deep); color: var(--on-deep); border-radius: 22px; padding: 1.75rem; }
    .avatar { width: 4.5rem; height: 4.5rem; border-radius: 50%; background: var(--amber); color: #2b1d00; display: grid; place-items: center; font: 700 2rem var(--display); overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-deep h2 { font-size: 1.5rem; margin-top: 1rem; }
    .card-deep .role { color: var(--on-deep-muted); }
    .facts { list-style: none; margin: 1.4rem 0 0; padding: 1.2rem 0 0; border-top: 1px solid #ffffff22; display: grid; gap: .6rem; }
    .facts li { display: flex; justify-content: space-between; gap: 1rem; }
    .facts span:first-child { color: var(--on-deep-muted); }

    /* work */
    .head { margin-bottom: 2rem; max-width: 52ch; }
    .head p { color: var(--muted); margin-top: .6rem; }
    .project { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; margin-bottom: 1.5rem; }
    @media (min-width: 860px) { .project { grid-template-columns: 1fr 1.05fr; } }
    .shot { background: var(--soft); display: grid; place-items: center; padding: 2rem; min-height: 260px; }
    .shot img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
    .project-body { padding: clamp(1.4rem, 3vw, 2.25rem); display: flex; flex-direction: column; gap: 1rem; }
    .kind { color: var(--muted); font-weight: 500; }
    .project h3 { font-size: 1.9rem; }
    .project ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; list-style: none; margin: 0; }
    .tags li, .chips li { background: var(--soft); border-radius: 8px; padding: .2rem .7rem; font-size: .9rem; font-weight: 500; }
    .project .actions { margin-top: auto; padding-top: .5rem; }

    /* skills */
    #skills { background: var(--surface); border-block: 1px solid var(--line); }
    .groups { display: grid; gap: 2rem; }
    @media (min-width: 760px) { .groups { grid-template-columns: repeat(3, 1fr); } }
    .group h3 { font-size: 1.2rem; margin-bottom: .4rem; }
    .group p { color: var(--muted); font-size: .95rem; margin-bottom: 1rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; margin: 0; padding: 0; }

    /* process */
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; counter-reset: step; }
    @media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
    .steps li { counter-increment: step; border-top: 3px solid var(--primary); padding-top: 1rem; }
    .steps li::before { content: "Step " counter(step); color: var(--muted); font-weight: 500; font-size: .9rem; }
    .steps h3 { font-size: 1.25rem; margin-block: .2rem .4rem; }
    .steps p { color: var(--muted); }

    /* contact */
    #contact { background: var(--deep); color: var(--on-deep); }
    #contact h2 { font-size: clamp(2rem, 5vw, 3.4rem); max-width: 18ch; }
    #contact p { color: var(--on-deep-muted); margin-block: 1rem 1.8rem; max-width: 48ch; }
    #contact .btn-primary { background: var(--amber); color: #2b1d00; }
    #contact .btn-light { background: var(--on-deep); color: var(--deep); border-color: var(--on-deep); }
    #contact .btn-line { border-color: #ffffff55; color: var(--on-deep); }
    #contact .btn-line:hover { background: #ffffff14; }
    #contact .email-line { margin-block: 0 1.8rem; max-width: none; }
    #contact .email-line a { color: var(--on-deep); font: 700 clamp(1.2rem, 4vw, 2rem) var(--display); word-break: break-all; }
    footer { padding-block: 1.5rem; color: var(--muted); font-size: .9rem; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <div class="wrap bar">
      <a class="logo" href="#top" id="logo"></a>
      <nav aria-label="Main">
        <a href="#work">Work</a>
        <a href="#skills">Skills</a>
        <a href="#process">Process</a>
      </nav>
      <a class="btn btn-primary" href="#contact">Hire me</a>
    </div>
  </header>

  <main id="main">
    <section id="top">
      <div class="wrap hero">
        <div>
          <p class="status"><i aria-hidden="true"></i><span id="availability"></span></p>
          <h1 id="headline"></h1>
          <p class="lead" id="intro"></p>
          <div class="actions">
            <a class="btn btn-primary" href="#work">See my work</a>
            <a class="btn btn-line" id="heroEmail" href="#contact">Email me</a>
          </div>
        </div>
        <aside class="card-deep" aria-label="Quick facts">
          <div class="avatar" id="avatar"></div>
          <h2 id="cardName"></h2>
          <p class="role" id="cardRole"></p>
          <ul class="facts" id="facts"></ul>
        </aside>
      </div>
    </section>

    <section id="work">
      <div class="wrap">
        <div class="head">
          <h2>Selected work</h2>
          <p>Projects I designed and built myself. Each one has a live link you can open.</p>
        </div>
        <div id="projects"></div>
      </div>
    </section>

    <section id="skills">
      <div class="wrap">
        <div class="head">
          <h2>Skills</h2>
          <p>The tools I use to build and ship client projects.</p>
        </div>
        <div class="groups" id="skillGroups"></div>
      </div>
    </section>

    <section id="process">
      <div class="wrap">
        <div class="head"><h2>How I work</h2></div>
        <ol class="steps" id="steps"></ol>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <h2>Have a project in mind?</h2>
        <p id="contactText"></p>
        <p class="email-line" id="emailLine" aria-live="polite" hidden><a id="emailLink" href="#"></a></p>
        <div class="actions" id="contactLinks"></div>
      </div>
    </section>
  </main>

  <footer class="wrap">
    <p id="footer"></p>
  </footer>

  <script>
    /* =========================================================
       EDIT THIS BLOCK ONLY. Everything on the page comes from it.
       Replace anything marked CHANGE ME with your real details.
       ========================================================= */
    const site = {
      name: "Silva",                          // CHANGE ME: your name or brand
      role: "Web developer",
      location: "",
      rate: "From $25/hr",                    // CHANGE ME or set to "" to hide
      photo: "",                              // optional: "photo.jpg" (put the file next to index.html)
      availability: "Open to new projects",   // CHANGE ME, e.g. "Booked until November"
      headline: "Websites that load fast and work on every phone.",
      intro: "I build business websites, WordPress stores and React apps for clients who want something clear, quick and easy to manage.",
      email: "adebayomikky1@gmail.com",
      upwork: "https://www.upwork.com/freelancers/~01cd488ff1943764b0?mp_source=share",
      github: "https://github.com/Silver123-prog",
      whatsapp: "",                           // optional: "https://wa.me/234XXXXXXXXXX"
    };

    const projects = [
      {
        title: "Silva Harbor",
        kind: "React web app with accounts and a database",
        summary: "A daily planner where anyone can create an account and keep their own plans. Sign up once, log in from any phone or browser, and your tasks are waiting.",
        points: [
          "Sign up, log in, and reset a forgotten password by email",
          "Plans stored in a cloud database, private to each account",
          "Pages for today, all tasks and each task's details",
          "Progress ring and weekly chart drawn with plain SVG and CSS",
          "Light and dark themes, and works with a keyboard",
        ],
        tags: ["React", "React Router", "Supabase", "Vite", "Vercel"],
        live: "https://silvaharbor.vercel.app",
        image: "harbor.png",  // optional: "harbor.png" screenshot saved next to index.html. Leave empty for the built-in preview.
      },
      /* ADD MORE PROJECTS: copy the block above, paste it here, and edit it.
         Only add projects you really built. */
    ];

    const skills = [
      { title: "Front end", note: "What the visitor sees and uses.",
        items: ["HTML5", "CSS3", "JavaScript", "React", "React Router", "Responsive design", "Accessibility"] },
      { title: "WordPress and stores", note: "Sites you can update yourself.",
        items: ["WordPress", "Theme customisation", "Online stores", "Product pages", "Payments setup"] },
      { title: "Tools", note: "How I build, track and publish.",
        items: ["Git", "GitHub", "Vite", "Vercel", "VS Code"] },
    ];

    const steps = [
      { title: "Agree the scope", text: "We confirm what you need, the pages involved, the deadline and the price before I start." },
      { title: "Build and share progress", text: "You see working versions along the way, so changes are cheap and nothing is a surprise." },
      { title: "Launch and hand over", text: "I publish the site, check it on phones and desktops, and show you how to manage it." },
    ];
    /* ================= END OF EDIT BLOCK ================= */

    const $ = (id) => document.getElementById(id);
    const el = (tag, attrs = {}, html = "") => {
      const e = document.createElement(tag);
      Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
      e.innerHTML = html;
      return e;
    };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    document.title = `${site.name} | ${site.role}`;
    $("logo").innerHTML =
      (site.photo ? `<span class="logo-mark"><img src="${esc(site.photo)}" alt="" /></span>` : `<span class="logo-mark" aria-hidden="true">⚓</span>`) +
      `<span>${esc(site.name)}</span>`;
    $("availability").textContent = site.availability;
    $("headline").textContent = site.headline;
    $("intro").textContent = site.intro;
    $("cardName").textContent = site.name;
    $("cardRole").textContent = site.role;
    $("avatar").innerHTML = site.photo ? `<img src="${esc(site.photo)}" alt="Portrait of ${esc(site.name)}" />` : esc(site.name[0]);

    const facts = [["Rate", site.rate], ["Works with", "Clients worldwide"]].filter((f) => f[1]);
    $("facts").innerHTML = facts.map(([k, v]) => `<li><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join("");

    // Built-in preview of Harbor (ring + bars) used when no screenshot is given
    const preview = `
      <svg viewBox="0 0 320 200" width="100%" role="img" aria-label="Preview of the planner dashboard" style="max-width:380px">
        <rect x="1" y="1" width="318" height="198" rx="14" fill="var(--surface)" stroke="var(--line)"/>
        <circle cx="80" cy="82" r="38" fill="none" stroke="var(--soft)" stroke-width="12"/>
        <circle cx="80" cy="82" r="38" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="100" transform="rotate(-90 80 82)"/>
        <text x="80" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">58%</text>
        <g fill="var(--soft)"><rect x="170" y="100" width="18" height="40" rx="4"/><rect x="196" y="80" width="18" height="60" rx="4"/><rect x="222" y="108" width="18" height="32" rx="4"/><rect x="248" y="70" width="18" height="70" rx="4"/></g>
        <rect x="274" y="56" width="18" height="84" rx="4" fill="var(--primary)"/>
        <g fill="var(--line)"><rect x="24" y="152" width="150" height="9" rx="4"/><rect x="24" y="170" width="110" height="9" rx="4"/></g>
      </svg>`;

    $("projects").append(...projects.map((p) => {
      const shot = p.image ? `<img src="${esc(p.image)}" alt="Screenshot of ${esc(p.title)}" />` : preview;
      const code = p.code ? `<a class="btn btn-line" href="${esc(p.code)}" target="_blank" rel="noreferrer">View code</a>` : "";
      const live = p.live ? `<a class="btn btn-primary" href="${esc(p.live)}" target="_blank" rel="noreferrer">Open live site</a>` : "";
      return el("article", { class: "project" }, `
        <div class="shot">${shot}</div>
        <div class="project-body">
          <p class="kind">${esc(p.kind)}</p>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.summary)}</p>
          <ul>${p.points.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          <ul class="tags" aria-label="Technologies used">${p.tags.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
          <div class="actions">${live}${code}</div>
        </div>`);
    }));

    $("skillGroups").append(...skills.map((g) => el("div", { class: "group" }, `
      <h3>${esc(g.title)}</h3><p>${esc(g.note)}</p>
      <ul class="chips">${g.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`)));

    $("steps").innerHTML = steps.map((s) => `<li><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></li>`).join("");

    $("contactText").textContent = `Tell me what you need built and your deadline. I'll reply with questions and a clear plan, usually within a day.`;
    $("emailLink").textContent = site.email;
    $("emailLink").href = `mailto:${site.email}`;
    const links = [
      [site.upwork, "Hire me on Upwork", "btn btn-primary"],
      [site.github, "GitHub", "btn btn-line"],
      [site.whatsapp, "WhatsApp", "btn btn-line"],
    ].filter((l) => l[0]);
    $("contactLinks").innerHTML =
      `<button class="btn btn-light" id="emailBtn" type="button">Show my email</button>` +
      links.map(([href, label, cls]) =>
        `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noreferrer">${esc(label)}</a>`).join("");

    // The address stays hidden until someone asks for it. After that, the button copies it.
    let revealed = false;
    const reveal = () => {
      revealed = true;
      $("emailLine").hidden = false;
      $("emailBtn").textContent = "Copy email";
    };
    $("emailBtn").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!revealed) return reveal();
      try { await navigator.clipboard.writeText(site.email); btn.textContent = "Copied!"; }
      catch { btn.textContent = "Copy it from above"; }
      setTimeout(() => (btn.textContent = "Copy email"), 2000);
    });
    $("heroEmail").addEventListener("click", reveal);

    $("footer").textContent = `© ${new Date().getFullYear()} ${site.name}`;
  </script>
</body>
</html>
